name: Update Blocklist Rules

on:
  schedule:
    # Запуск каждые 12 часов
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rules:
    name: Build 200k-250k Optimized Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download and Process Rulesets
        run: |
          echo "Downloading curated blocklists..."
          # 1. HaGeZi Multi PRO (~225k доменов — топовый баланс без ложных срабатываний)
          curl -sL "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/hosts/pro.txt" -o src_hagezi.txt

          # 2. StevenBlack Unified (~80k доменов — классика рекламы и телеметрии)
          curl -sL "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts" -o src_steven.txt

          # 3. AdGuard DNS Filter (официальный лист AdGuard)
          curl -sL "https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt" -o src_adguard.txt

          # 4. Мобильная телеметрия и трекеры
          curl -sL "https://v.firebog.net/hosts/Easyprivacy.txt" -o src_easyprivacy.txt

          python3 - << 'EOF'
          import glob
          import re

          domains = set()
          # Строгая проверка доменного имени
          domain_regex = re.compile(r'^(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,}$')

          for filepath in glob.glob('src_*.txt'):
              print(f"Reading {filepath}...")
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                      for line in f:
                          l = line.strip().lower()
                          if not l or l.startswith(('#', '!', ';', '//')):
                              continue
                          
                          # Отрезаем комментарии в конце
                          l = l.split('#')[0].strip()

                          # Формат hosts: 0.0.0.0 domain.com или 127.0.0.1 domain.com
                          if l.startswith(('0.0.0.0 ', '127.0.0.1 ')):
                              parts = l.split()
                              if len(parts) >= 2:
                                  d = parts[1].strip()
                                  if d not in ('0.0.0.0', '127.0.0.1', 'localhost', 'broadcasthost') and domain_regex.match(d):
                                      domains.add(d)

                          # Формат adblock: ||domain.com^
                          elif l.startswith('||') and l.endswith('^'):
                              d = l[2:-1].strip()
                              if domain_regex.match(d):
                                  domains.add(d)

                          # Простой список доменов (по одному на строку)
                          elif ' ' not in l and '/' not in l and domain_regex.match(l):
                              domains.add(l)
              except Exception as e:
                  print(f"Error reading {filepath}: {e}")

          # Обязательные домены мобильных сетей в РФ/СНГ
          mandatory_mobile = [
              'an.yandex.ru',
              'mc.yandex.ru',
              'adservice.google.com',
              'pagead2.googlesyndication.com',
              'googleads.g.doubleclick.net',
              'ads.admob.com',
              'applovin.com',
              'unityads.unity3d.com',
              'ads.tiktok.com',
              'adcolony.com',
              'vungle.com',
              'ironsrc.com',
              'chartboost.com',
              'mytarget.ru',
              'target.my.com'
          ]
          for d in mandatory_mobile:
              domains.add(d)

          print(f"Total Unique Filtered Domains: {len(domains)}")

          # Сохраняем готовый отсортированный файл rules.txt
          with open('rules.txt', 'w', encoding='utf-8') as f:
              for d in sorted(domains):
                  f.write(f"{d}\n")
          EOF

          rm -f src_*.txt

      - name: Commit and Push rules.txt
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update rules.txt (~200k-250k optimized pack) [skip ci]"
          file_pattern: 'rules.txt'
