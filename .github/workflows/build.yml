name: Build and Release AdLocker

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Clean build cache and fetch dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --target-platform=android-arm,android-arm64 --no-shrink

      - name: Sign APK (v1 + v2 + v3)
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias adlocker \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass adlocker123 -keypass adlocker123 \
            -dname "CN=AdLocker, OU=App, O=AdLocker, L=City, S=State, C=RU"

          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -name "apksigner" -type f | sort -V | tail -n 1)
          TOOLS_DIR=$(dirname "$APKSIGNER")
          ZIPALIGN="$TOOLS_DIR/zipalign"

          ORIGINAL_APK="build/app/outputs/flutter-apk/app-release-unsigned.apk"
          if [ ! -f "$ORIGINAL_APK" ]; then
            ORIGINAL_APK="build/app/outputs/flutter-apk/app-release.apk"
          fi

          "$ZIPALIGN" -f -p 4 "$ORIGINAL_APK" build/app/outputs/flutter-apk/app-aligned.apk

          "$APKSIGNER" sign --ks release.keystore \
            --ks-key-alias adlocker \
            --ks-pass pass:adlocker123 \
            --key-pass pass:adlocker123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out build/app/outputs/flutter-apk/AdLocker.apk \
            build/app/outputs/flutter-apk/app-aligned.apk

          "$APKSIGNER" verify -v build/app/outputs/flutter-apk/AdLocker.apk

      - name: Release Signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: AdLocker v1.0.0 (Build ${{ github.run_number }})
          body: "Релиз с исправленной проверкой доменов и корректными путями к базе правил."
          files: build/app/outputs/flutter-apk/AdLocker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
