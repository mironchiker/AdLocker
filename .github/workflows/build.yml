name: Build and Release AdLocker

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Clean build cache and fetch dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --target-platform=android-arm,android-arm64 --no-shrink

      - name: Sign APK (v1 + v2 + v3)
        run: |
          # 1. Генерируем релизный ключ
          keytool -genkeypair -v -keystore release.keystore -alias adlocker \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass adlocker123 -keypass adlocker123 \
            -dname "CN=AdLocker, OU=App, O=AdLocker, L=City, S=State, C=RU"

          # 2. Находим утилиты сборки Android SDK
          BUILD_TOOLS_DIR=$(find $ANDROID_SDK_ROOT/build-tools -type d | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          ORIGINAL_APK="build/app/outputs/flutter-apk/app-release-unsigned.apk"
          if [ ! -f "$ORIGINAL_APK" ]; then
            ORIGINAL_APK="build/app/outputs/flutter-apk/app-release.apk"
          fi

          echo "Using APK: $ORIGINAL_APK"

          # 3. Выравнивание 4-byte (zipalign)
          $ZIPALIGN -f 4 "$ORIGINAL_APK" build/app/outputs/flutter-apk/app-aligned.apk

          # 4. Подпись через apksigner (v1, v2, v3 схемы)
          $APKSIGNER sign --ks release.keystore \
            --ks-key-alias adlocker \
            --ks-pass pass:adlocker123 \
            --key-pass pass:adlocker123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out build/app/outputs/flutter-apk/AdLocker.apk \
            build/app/outputs/flutter-apk/app-aligned.apk

          # 5. Проверка целостности подписи
          $APKSIGNER verify -v build/app/outputs/flutter-apk/AdLocker.apk

      - name: Release Signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: AdLocker v1.0.0 (Build ${{ github.run_number }})
          body: "Готовый подписанный релиз AdLocker (RFC 1071 IP Checksum + xbox-dns.ru + local sinkhole)."
          files: build/app/outputs/flutter-apk/AdLocker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
