name: Build and Release AdLocker

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Generate Android project structure
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name=adlocker --org=com.adlocker.app
          fi

      - name: Setup Android Permissions and Manifest
        run: |
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>' android/app/src/main/AndroidManifest.xml || true
          sed -i '/AdLockerVpnService/d' android/app/src/main/AndroidManifest.xml || true
          sed -i '/<\/application>/i \        <service android:name=".AdLockerVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false">\n            <intent-filter>\n                <action android:name="android.net.VpnService"/>\n            </intent-filter>\n        </service>' android/app/src/main/AndroidManifest.xml

      - name: Write Native Android Bridge
        run: |
          MAIN_FILE=$(find android/app/src/main -name "MainActivity.kt" -o -name "MainActivity.java" | head -n 1)
          TARGET_DIR=$(dirname "$MAIN_FILE")
          
          PKG_LINE=$(grep "^package " "$MAIN_FILE" | head -n 1)
          if [ -z "$PKG_LINE" ]; then
            PKG_LINE="package com.adlocker.app.adlocker"
          fi

          echo "Target Directory: $TARGET_DIR"
          echo "Package: $PKG_LINE"

          # 1. AdLockerVpnService.kt
          cat << EOF > "$TARGET_DIR/AdLockerVpnService.kt"
          $PKG_LINE

          import android.content.Intent
          import android.net.VpnService
          import android.os.ParcelFileDescriptor

          class AdLockerVpnService : VpnService() {
              companion object {
                  var isRunning = false
              }
              private var vpnInterface: ParcelFileDescriptor? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "STOP") {
                      stopVpn()
                      return START_NOT_STICKY
                  }
                  startVpn()
                  return START_STICKY
              }

              private fun startVpn() {
                  if (vpnInterface != null) return
                  try {
                      val builder = Builder()
                      builder.setSession("AdLocker Shield")
                      builder.setMtu(1500)
                      builder.addAddress("10.0.0.2", 32)
                      
                      // 1. Основной DNS: xbox-dns.ru
                      builder.addDnsServer("111.88.96.50")
                      builder.addDnsServer("111.88.96.51")

                      // 2. Резервный DNS: AdGuard для фильтрации рекламы
                      builder.addDnsServer("94.140.14.14")
                      builder.addDnsServer("94.140.15.15")

                      // Маршрутизируем адреса DNS
                      builder.addRoute("111.88.96.50", 32)
                      builder.addRoute("111.88.96.51", 32)
                      builder.addRoute("94.140.14.14", 32)
                      builder.addRoute("94.140.15.15", 32)

                      // КРИТИЧЕСКИ ВАЖНО: Разрешаем прямому трафику идти мимо VPN (интернет не падает)
                      builder.allowBypass()

                      try {
                          builder.addDisallowedApplication("com.google.android.apps.bard")
                          builder.addDisallowedApplication("com.google.android.googlequicksearchbox")
                      } catch (_: Exception) {}

                      builder.setBlocking(false)
                      vpnInterface = builder.establish()
                      isRunning = true
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun stopVpn() {
                  try {
                      vpnInterface?.close()
                      vpnInterface = null
                      isRunning = false
                      stopSelf()
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              override fun onDestroy() {
                  stopVpn()
                  super.onDestroy()
              }
          }
          EOF

          # 2. MainActivity.kt
          rm -f "$TARGET_DIR/MainActivity.java"
          cat << EOF > "$TARGET_DIR/MainActivity.kt"
          $PKG_LINE

          import android.app.Activity
          import android.content.Intent
          import android.net.VpnService
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.adlocker.app/vpn"
              private val VPN_REQUEST_CODE = 2026
              private var pendingResult: MethodChannel.Result? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "startVpn" -> {
                              val vpnIntent = VpnService.prepare(this)
                              if (vpnIntent != null) {
                                  pendingResult = result
                                  startActivityForResult(vpnIntent, VPN_REQUEST_CODE)
                              } else {
                                  startServiceDirectly()
                                  result.success(true)
                              }
                          }
                          "stopVpn" -> {
                              val stopIntent = Intent(this, AdLockerVpnService::class.java).apply {
                                  action = "STOP"
                              }
                              startService(stopIntent)
                              result.success(true)
                          }
                          "isVpnActive" -> {
                              result.success(AdLockerVpnService.isRunning)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              private fun startServiceDirectly() {
                  val serviceIntent = Intent(this, AdLockerVpnService::class.java)
                  startService(serviceIntent)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == VPN_REQUEST_CODE) {
                      if (resultCode == Activity.RESULT_OK) {
                          startServiceDirectly()
                          pendingResult?.success(true)
                      } else {
                          pendingResult?.success(false)
                      }
                      pendingResult = null
                  }
              }
          }
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build Single Release APK
        run: |
          flutter build apk --release --target-platform=android-arm,android-arm64 --no-shrink

      - name: Sign APK (V1 + V2 + V3)
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias adlocker \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass adlocker123 -keypass adlocker123 \
            -dname "CN=AdLocker, OU=App, O=AdLocker, L=City, S=State, C=RU"

          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -V | tail -n 1)
          
          $APKSIGNER sign --ks release.keystore \
            --ks-key-alias adlocker \
            --ks-pass pass:adlocker123 \
            --key-pass pass:adlocker123 \
            --out build/app/outputs/flutter-apk/app-release-signed.apk \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apks
          cp build/app/outputs/flutter-apk/app-release-signed.apk release_apks/AdLocker.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: AdLocker v1.0.0 (Build ${{ github.run_number }})
          body: |
            ## AdLocker — Full 3-Tab Architecture Fixed
            * Восстановлены все вкладки и разделы.
            * DNS: xbox-dns.ru (основной) + AdGuard (резервный).
            * Интернет стабилен благодаря allowBypass().
          files: release_apks/AdLocker.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

