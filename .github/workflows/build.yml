name: Build and Release AdLocker

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Generate Android project structure
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name=adlocker --org=com.adlocker.app
          fi

      - name: Setup Android Permissions and Manifest
        run: |
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>' android/app/src/main/AndroidManifest.xml || true
          sed -i '/AdLockerVpnService/d' android/app/src/main/AndroidManifest.xml || true
          sed -i '/<\/application>/i \        <service android:name=".AdLockerVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false">\n            <intent-filter>\n                <action android:name="android.net.VpnService"/>\n            </intent-filter>\n        </service>' android/app/src/main/AndroidManifest.xml

      - name: Write Native Self-Hosted DNS Engine
        run: |
          MAIN_FILE=$(find android/app/src/main -name "MainActivity.kt" -o -name "MainActivity.java" | head -n 1)
          TARGET_DIR=$(dirname "$MAIN_FILE")
          
          PKG_LINE=$(grep "^package " "$MAIN_FILE" | head -n 1)
          if [ -z "$PKG_LINE" ]; then
            PKG_LINE="package com.adlocker.app.adlocker"
          fi

          # 1. AdLockerVpnService.kt
          cat << EOF > "$TARGET_DIR/AdLockerVpnService.kt"
          $PKG_LINE

          import android.content.Intent
          import android.net.VpnService
          import android.os.ParcelFileDescriptor
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.net.DatagramPacket
          import java.net.DatagramSocket
          import java.net.InetAddress
          import java.nio.ByteBuffer
          import kotlin.concurrent.thread

          class AdLockerVpnService : VpnService() {
              companion object {
                  var isRunning = false
                  var useLocalSinkhole = true
                  var blockedCount = 0
                  var totalQueries = 0
                  val recentQueries = ArrayList<HashMap<String, Any>>()
              }

              private var vpnInterface: ParcelFileDescriptor? = null
              private var isWorkerRunning = false
              private val blockedRules = HashSet<String>()
              private val whitelist = HashSet<String>()

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "STOP") {
                      stopVpn()
                      return START_NOT_STICKY
                  }
                  useLocalSinkhole = intent?.getBooleanExtra("useLocalSinkhole", true) ?: true
                  loadRules()
                  startVpn()
                  return START_STICKY
              }

              private fun loadRules() {
                  thread {
                      try {
                          val rulesFile = File(filesDir, "adblock_hosts_rules.txt")
                          if (rulesFile.exists()) {
                              val lines = rulesFile.readLines()
                              synchronized(blockedRules) {
                                  blockedRules.clear()
                                  for (l in lines) {
                                      val t = l.trim()
                                      if (t.isNotEmpty() && !t.startsWith("#")) {
                                          blockedRules.add(t.lowercase())
                                      }
                                  }
                              }
                          }
                          val wlFile = File(filesDir, "whitelist.txt")
                          if (wlFile.exists()) {
                              val wlLines = wlFile.readLines()
                              synchronized(whitelist) {
                                  whitelist.clear()
                                  for (w in wlLines) {
                                      val t = w.trim().lowercase()
                                      if (t.isNotEmpty()) whitelist.add(t)
                                  }
                              }
                          }
                      } catch (_: Exception) {}
                  }
              }

              private fun startVpn() {
                  if (vpnInterface != null) return
                  try {
                      val builder = Builder()
                      builder.setSession("AdLocker Shield")
                      builder.addAddress("10.0.0.2", 32)
                      
                      builder.addDnsServer("10.0.0.2")
                      builder.addRoute("10.0.0.2", 32)

                      try {
                          builder.addDisallowedApplication("com.google.android.apps.bard")
                      } catch (_: Exception) {}

                      builder.setBlocking(true)
                      vpnInterface = builder.establish()
                      isRunning = true
                      isWorkerRunning = true

                      startPacketLoop()
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun startPacketLoop() {
                  thread(name = "AdLocker-EngineThread") {
                      val pfd = vpnInterface ?: return@thread
                      val inStream = FileInputStream(pfd.fileDescriptor)
                      val outStream = FileOutputStream(pfd.fileDescriptor)
                      val packet = ByteArray(32767)

                      val upstreamXbox = InetAddress.getByName("111.88.96.50")
                      val fallbackAdguard = InetAddress.getByName("94.140.14.14")

                      val forwardSocket = DatagramSocket()
                      protect(forwardSocket)
                      forwardSocket.soTimeout = 2500

                      while (isWorkerRunning) {
                          try {
                              val length = inStream.read(packet)
                              if (length <= 0) continue

                              val version = (packet[0].toInt() shr 4) and 0x0F
                              if (version != 4) continue
                              val protocol = packet[9].toInt() and 0xFF
                              if (protocol != 17) continue

                              val ihl = (packet[0].toInt() and 0x0F) * 4
                              val udpDstPort = ((packet[ihl + 2].toInt() and 0xFF) shl 8) or (packet[ihl + 3].toInt() and 0xFF)

                              if (udpDstPort == 53) {
                                  val udpPayloadOffset = ihl + 8
                                  val dnsLength = length - udpPayloadOffset
                                  if (dnsLength < 12) continue

                                  val dnsBytes = ByteArray(dnsLength)
                                  System.arraycopy(packet, udpPayloadOffset, dnsBytes, 0, dnsLength)

                                  val qname = parseDnsQName(dnsBytes)
                                  totalQueries++

                                  val isBlocked = isDomainBlocked(qname)

                                  synchronized(recentQueries) {
                                      val logMap = HashMap<String, Any>()
                                      logMap["domain"] = qname
                                      logMap["blocked"] = if (useLocalSinkhole) isBlocked else false
                                      logMap["time"] = System.currentTimeMillis()
                                      recentQueries.add(0, logMap)
                                      if (recentQueries.size > 150) {
                                          recentQueries.removeAt(recentQueries.size - 1)
                                      }
                                  }

                                  if (useLocalSinkhole && isBlocked) {
                                      blockedCount++
                                      val replyDns = build0000Response(dnsBytes)
                                      val replyIpPacket = buildIpUdpPacket(packet, ihl, replyDns)
                                      outStream.write(replyIpPacket)
                                  } else {
                                      val targetDns = if (!useLocalSinkhole) fallbackAdguard else upstreamXbox
                                      val outDatagram = DatagramPacket(dnsBytes, dnsLength, targetDns, 53)
                                      try {
                                          forwardSocket.send(outDatagram)
                                          val respBuf = ByteArray(4096)
                                          val inDatagram = DatagramPacket(respBuf, respBuf.size)
                                          forwardSocket.receive(inDatagram)

                                          val replyDns = ByteArray(inDatagram.length)
                                          System.arraycopy(respBuf, 0, replyDns, 0, inDatagram.length)
                                          val replyIpPacket = buildIpUdpPacket(packet, ihl, replyDns)
                                          outStream.write(replyIpPacket)
                                      } catch (e: Exception) {
                                          if (targetDns != fallbackAdguard) {
                                              val fbDatagram = DatagramPacket(dnsBytes, dnsLength, fallbackAdguard, 53)
                                              forwardSocket.send(fbDatagram)
                                              val fbBuf = ByteArray(4096)
                                              val inFb = DatagramPacket(fbBuf, fbBuf.size)
                                              forwardSocket.receive(inFb)

                                              val replyDns = ByteArray(inFb.length)
                                              System.arraycopy(fbBuf, 0, replyDns, 0, inFb.length)
                                              val replyIpPacket = buildIpUdpPacket(packet, ihl, replyDns)
                                              outStream.write(replyIpPacket)
                                          }
                                      }
                                  }
                              }
                          } catch (_: Exception) {}
                      }
                      try { forwardSocket.close() } catch (_: Exception) {}
                  }
              }

              private fun isDomainBlocked(domain: String): Boolean {
                  if (domain.isEmpty()) return false
                  val d = domain.lowercase()
                  synchronized(whitelist) {
                      if (whitelist.contains(d)) return false
                  }
                  synchronized(blockedRules) {
                      if (blockedRules.contains(d)) return true
                      for (r in blockedRules) {
                          if (d.endsWith(".$r")) return true
                      }
                  }
                  return false
              }

              private fun parseDnsQName(dns: ByteArray): String {
                  var pos = 12
                  val sb = StringBuilder()
                  while (pos < dns.size) {
                      val len = dns[pos].toInt() and 0xFF
                      if (len == 0) break
                      if ((len and 0xC0) == 0xC0) break
                      pos++
                      if (pos + len > dns.size) break
                      if (sb.isNotEmpty()) sb.append(".")
                      sb.append(String(dns, pos, len, Charsets.US_ASCII))
                      pos += len
                  }
                  return sb.toString()
              }

              private fun build0000Response(query: ByteArray): ByteArray {
                  val bb = ByteBuffer.allocate(query.size + 16)
                  bb.put(query[0])
                  bb.put(query[1])
                  bb.put(0x81.toByte())
                  bb.put(0x80.toByte())
                  bb.putShort(1)
                  bb.putShort(1)
                  bb.putShort(0)
                  bb.putShort(0)
                  bb.put(query, 12, query.size - 12)
                  bb.put(0xC0.toByte())
                  bb.put(0x0C.toByte())
                  bb.putShort(1)
                  bb.putShort(1)
                  bb.putInt(60)
                  bb.putShort(4)
                  bb.put(0.toByte())
                  bb.put(0.toByte())
                  bb.put(0.toByte())
                  bb.put(0.toByte())

                  val res = ByteArray(bb.position())
                  System.arraycopy(bb.array(), 0, res, 0, res.size)
                  return res
              }

              private fun buildIpUdpPacket(reqPacket: ByteArray, ihl: Int, dnsPayload: ByteArray): ByteArray {
                  val totalLen = 20 + 8 + dnsPayload.size
                  val out = ByteArray(totalLen)
                  
                  out[0] = 0x45.toByte()
                  out[1] = 0
                  out[2] = ((totalLen shr 8) and 0xFF).toByte()
                  out[3] = (totalLen and 0xFF).toByte()
                  out[4] = 0
                  out[5] = 0
                  out[6] = 0x40.toByte()
                  out[7] = 0
                  out[8] = 64
                  out[9] = 17
                  
                  System.arraycopy(reqPacket, 16, out, 12, 4)
                  System.arraycopy(reqPacket, 12, out, 16, 4)

                  out[20] = reqPacket[ihl + 2]
                  out[21] = reqPacket[ihl + 3]
                  out[22] = reqPacket[ihl]
                  out[23] = reqPacket[ihl + 1]
                  val udpLen = 8 + dnsPayload.size
                  out[24] = ((udpLen shr 8) and 0xFF).toByte()
                  out[25] = (udpLen and 0xFF).toByte()
                  out[26] = 0
                  out[27] = 0

                  System.arraycopy(dnsPayload, 0, out, 28, dnsPayload.size)
                  return out
              }

              private fun stopVpn() {
                  isWorkerRunning = false
                  try {
                      vpnInterface?.close()
                      vpnInterface = null
                      isRunning = false
                      stopSelf()
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              override fun onDestroy() {
                  stopVpn()
                  super.onDestroy()
              }
          }
          EOF

          # 2. MainActivity.kt
          rm -f "$TARGET_DIR/MainActivity.java"
          cat << EOF > "$TARGET_DIR/MainActivity.kt"
          $PKG_LINE

          import android.app.Activity
          import android.content.Intent
          import android.net.VpnService
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.adlocker.app/vpn"
              private val VPN_REQUEST_CODE = 2026
              private var pendingResult: MethodChannel.Result? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "startVpn" -> {
                              val useLocal = call.argument<Boolean>("useLocalSinkhole") ?: true
                              val vpnIntent = VpnService.prepare(this)
                              if (vpnIntent != null) {
                                  pendingResult = result
                                  startActivityForResult(vpnIntent, VPN_REQUEST_CODE)
                              } else {
                                  startServiceDirectly(useLocal)
                                  result.success(true)
                              }
                          }
                          "stopVpn" -> {
                              val stopIntent = Intent(this, AdLockerVpnService::class.java).apply {
                                  action = "STOP"
                              }
                              startService(stopIntent)
                              result.success(true)
                          }
                          "getStats" -> {
                              val map = HashMap<String, Any>()
                              map["isRunning"] = AdLockerVpnService.isRunning
                              map["blockedCount"] = AdLockerVpnService.blockedCount
                              map["totalQueries"] = AdLockerVpnService.totalQueries
                              synchronized(AdLockerVpnService.recentQueries) {
                                  map["recentQueries"] = ArrayList(AdLockerVpnService.recentQueries)
                              }
                              result.success(map)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              private fun startServiceDirectly(useLocal: Boolean) {
                  val serviceIntent = Intent(this, AdLockerVpnService::class.java).apply {
                      putExtra("useLocalSinkhole", useLocal)
                  }
                  startService(serviceIntent)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == VPN_REQUEST_CODE) {
                      if (resultCode == Activity.RESULT_OK) {
                          startServiceDirectly(true)
                          pendingResult?.success(true)
                      } else {
                          pendingResult?.success(false)
                      }
                      pendingResult = null
                  }
              }
          }
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build Single Release APK
        run: |
          flutter build apk --release --target-platform=android-arm,android-arm64 --no-shrink

      - name: Sign APK (V1 + V2 + V3)
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias adlocker \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass adlocker123 -keypass adlocker123 \
            -dname "CN=AdLocker, OU=App, O=AdLocker, L=City, S=State, C=RU"

          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -V | tail -n 1)
          
          $APKSIGNER sign --ks release.keystore \
            --ks-key-alias adlocker \
            --ks-pass pass:adlocker123 \
            --key-pass pass:adlocker123 \
            --out build/app/outputs/flutter-apk/app-release-signed.apk \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apks
          cp build/app/outputs/flutter-apk/app-release-signed.apk release_apks/AdLocker.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: AdLocker v1.0.0 (Build ${{ github.run_number }})
          body: |
            ## AdLocker — Autonomous 0.0.0.0 Engine
            * Нативный разбор UDP DNS и локальный возврат 0.0.0.0.
            * Автоматический фоллбек на AdGuard при сбое сокетов.
            * Настоящий живой поток сетевых запросов.
          files: release_apks/AdLocker.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
