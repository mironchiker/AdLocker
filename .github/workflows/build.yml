name: Build and Release AdLocker

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Fix Android v2 Embedding and Manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          # Убираем старый класс FlutterApplication v1 embedding
          sed -i 's/android:name="io.flutter.app.FlutterApplication"//g' "$MANIFEST" || true
          
          # Убираем устаревший meta-data flutterEmbedding, если он был со значением 1
          sed -i '/android:name="flutterEmbedding"/d' "$MANIFEST" || true
          
          # Добавляем современный v2 embedding
          sed -i '/<application/a \        <meta-data android:name="flutterEmbedding" android:value="2"/>' "$MANIFEST" || true

          # Добавляем разрешения
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>' "$MANIFEST" || true
          
          # Регистрируем VpnService
          sed -i '/AdLockerVpnService/d' "$MANIFEST" || true
          sed -i '/<\/application>/i \        <service android:name=".AdLockerVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false">\n            <intent-filter>\n                <action android:name="android.net.VpnService"/>\n            </intent-filter>\n        </service>' "$MANIFEST" || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --target-platform=android-arm,android-arm64 --no-shrink

      - name: Sign APK
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias adlocker \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass adlocker123 -keypass adlocker123 \
            -dname "CN=AdLocker, OU=App, O=AdLocker, L=City, S=State, C=RU"

          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -V | tail -n 1)
          $APKSIGNER sign --ks release.keystore \
            --ks-key-alias adlocker \
            --ks-pass pass:adlocker123 \
            --key-pass pass:adlocker123 \
            --out build/app/outputs/flutter-apk/app-release-signed.apk \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: AdLocker v1.0.0 (Build ${{ github.run_number }})
          body: "Исправлена ошибка Android v1 embedding. Полная поддержка v2 embedding."
          files: build/app/outputs/flutter-apk/app-release-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
